<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brands Photography | YWM</title>

<style>
body{
  margin:0;
  background:#030303;
  color:white;
  font-family:Arial,sans-serif;
}

.header{
  padding:30px;
  text-align:center;
}

.header h1{
  margin:0;
  color:#f4c400;
}

.back{
  display:inline-block;
  margin-top:15px;
  color:#f4c400;
  text-decoration:none;
}

.gallery{
  columns:4 200px;
  column-gap:12px;
  padding:30px;
}

.gallery img{
  width:100%;
  margin-bottom:12px;
  border-radius:20px;
  display:block;
  break-inside:avoid;
  cursor:pointer;
  transition:.3s ease;
}

.gallery img:hover{
  transform:scale(1.08);
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}

@media(max-width:768px){
  .gallery{
    columns:2 120px;
    column-gap:8px;
    padding:14px;
  }

  .gallery img{
    margin-bottom:8px;
    border-radius:14px;
  }
}
header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(10px);
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  height:45px;
}

.back-btn{
  color:#f4c400;
  font-size:14px;
  font-weight:bold;
  text-decoration:none;
}

.lang-btn{
  color:white;
  text-decoration:none;
  font-weight:500;
  display:flex;
  align-items:center;
  gap:6px;
}

.lang-btn:hover{
  color:#f4c400;
}
</style>
</head>

<body>

<header>
  <a href="index.html">
    <img src="assets/ywm-logo-transparent.png" class="logo" alt="YWM">
  </a>

  <div style="display:flex;align-items:center;gap:20px;">

    <a href="work.html" class="back-btn"
       data-en="← Back to Work"

      ← Back to Work

    <a href="https://www.facebook.com/yellowworldmedia" target="_blank">
      <img src="assets/sm_icons/fb.png" alt="Facebook" style="width:18px;height:18px;">

    <a href="https://www.youtube.com/@yellowworldmedia5967" target="_blank">

    <a class="lang-btn" href="#" onclick="setLanguage('en'); return false;">🇬🇧 ENG</a>
    <a class="lang-btn" href="#" onclick="setLanguage('cz'); return false;">🇨🇿 CZ</a>

<div class="header">

  <img src="assets/brands/fv1.jpg" alt="">

<div id="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>

<style>
#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  cursor:pointer;
}

#lightbox img{
  max-width:95vw;
  max-height:95vh;
  border-radius:12px;
}
</style>

<script>
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

document.querySelectorAll('.gallery img').forEach(img => {
  img.style.cursor = 'pointer';

  img.addEventListener('click', () => {
    lightboxImg.src = img.src;
    lightbox.style.display = 'flex';
  });
});

lightbox.addEventListener('click', () => {
  lightbox.style.display = 'none';
});
</script>
<script>
function setLanguage(lang) {
  document.querySelectorAll('[data-en][data-cz]').forEach((el) => {
    el.textContent = el.dataset[lang];
  });

  localStorage.setItem('ywm-language', lang);
}

document.addEventListener('DOMContentLoaded', () => {
  const savedLanguage = localStorage.getItem('ywm-language') || 'en';
  setLanguage(savedLanguage);
});
</script>
</body>
</html>
