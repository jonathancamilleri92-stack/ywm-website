<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Bags & Accessories | YWM</title>

<style>
:root{
  --yellow:#f4c400;
  --black:#030303;
  --white:#ffffff;
  --line:rgba(255,255,255,.12);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--black);
  color:var(--white);
  font-family:Arial,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(10px);
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  height:45px;
}

.back-btn{
  color:var(--yellow);
  font-size:14px;
  font-weight:bold;
}

.hero{
  text-align:center;
  padding:80px 20px 50px;
}

.hero h1{
  font-size:clamp(40px,8vw,80px);
  color:var(--yellow);
  margin-bottom:20px;
}

.hero p{
  max-width:800px;
  margin:auto;
  color:#bfbfbf;
  line-height:1.6;
}

.container{
  width:min(1200px,92%);
  margin:auto;
  padding-bottom:80px;
}

.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
  gap:24px;
}

.video-card{
  background:#0d0d0d;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
}

.video-card video{
  width:100%;
  display:block;
}

.video-info{
  padding:18px;
}

.video-info h3{
  margin-bottom:10px;
}

.video-info p{
  color:#bcbcbc;
  line-height:1.5;
}

footer{
  border-top:1px solid var(--line);
  text-align:center;
  padding:30px;
  color:#8f8f8f;
}

@media(max-width:768px){
  header{
    padding:15px 20px;
  }

  .logo{
    height:35px;
  }

  .video-grid{
    grid-template-columns:1fr;
  }
}
.lang-btn{
  color:white;
  text-decoration:none;
  font-weight:500;
  display:flex;
  align-items:center;
  gap:6px;
}

.lang-btn:hover{
  color:#f4c400;
}
</style>
</head>

<body>

<header>
  <a href="index.html">
    <img src="assets/ywm-logo-transparent.png" class="logo" alt="YWM">
  </a>

  <div style="display:flex;align-items:center;gap:20px;">

    <a href="work.html" class="back-btn"
       data-en="← Back to Work"
       data-cz="← Zpět na portfolio">
      ← Back to Work
    </a>

    <a href="https://www.facebook.com/yellowworldmedia" target="_blank">
      <img src="assets/sm_icons/fb.png" alt="Facebook" style="width:18px;height:18px;">
    </a>

    <a href="https://www.instagram.com/yellow_world_media/" target="_blank">
      <img src="assets/sm_icons/insta.png" alt="Instagram" style="width:18px;height:18px;">
    </a>

    <a href="https://www.youtube.com/@yellowworldmedia5967" target="_blank">
      <img src="assets/sm_icons/yt.png" alt="YouTube" style="width:18px;height:18px;">
    </a>

    <a class="lang-btn" href="#" onclick="setLanguage('en'); return false;">🇬🇧 ENG</a>
<a class="lang-btn" href="#" onclick="setLanguage('cz'); return false;">🇨🇿 CZ</a>

  </div>
</header>

<section class="hero">
<h1
  data-en="Luxury Bags & Accessories"

<p
  data-en="Short-form product content designed for attention and style."
  data-cz="Krátká produktová videa vytvořená pro maximální pozornost a styl.">
  Short-form product content designed for attention and style.
</p>
</section>

<div class="container">

  <div class="video-grid">

    <div class="video-card">
      <video controls playsinline>
        <source src="assets/handbag-brand/D1_Anekke_Rakovnik 15s.mp4" type="video/mp4">
      </video>
      <div class="video-info">
        <h3>Anekke</h3>
<p
  data-en="Rakovnik Project"
  data-cz="Projekt Rakovník">
  Rakovnik Project
</p>
      </div>
    </div>

        <div class="video-card">
      <video controls playsinline>
        <source src="assets/handbag-brand/SS25-ANEKKE PRAHA.mp4" type="video/mp4">
      </video>
      <div class="video-info">
        <h3>Anekke</h3>
        <p
  data-en="Prague Project"

 <div class="video-card">
      <video controls playsinline>

      <div class="video-info">
        <h3>Anekke</h3>
        <p
  data-en="Kaolin Project"
  data-cz="Projekt Kaolin">
  Kaolin Project
        </p>
      </div>
    </div>
  </div>

</div>

<footer>
  © 2026 YWM — Yellow World Media
</footer>
<script>
function setLanguage(lang) {
  document.querySelectorAll('[data-en][data-cz]').forEach((el) => {
    el.textContent = el.dataset[lang];
  });

  localStorage.setItem('ywm-language', lang);
}

document.addEventListener('DOMContentLoaded', () => {
  const savedLanguage = localStorage.getItem('ywm-language') || 'en';
  setLanguage(savedLanguage);
});
</script>
</body>
</html>
