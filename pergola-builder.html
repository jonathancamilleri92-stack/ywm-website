<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landscape Excellence | YWM</title>

<style>
:root{
  --yellow:#f4c400;
  --black:#030303;
  --white:#ffffff;
  --line:rgba(255,255,255,.12);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--black);
  color:var(--white);
  font-family:Arial,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(10px);
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  height:45px;
}

.back-btn{
  color:var(--yellow);
  font-size:14px;
  font-weight:bold;
}

.hero{
  text-align:center;
  padding:80px 20px 50px;
}

.hero h1{
  font-size:clamp(40px,8vw,80px);
  color:var(--yellow);
  margin-bottom:20px;
}

.hero p{
  max-width:800px;
  margin:auto;
  color:#bfbfbf;
  line-height:1.6;
}

.container{
  width:min(1200px,92%);
  margin:auto;
  padding-bottom:80px;
}

.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
  gap:24px;
}

.video-card{
  background:#0d0d0d;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
}

.video-card video{
  width:100%;
  display:block;
}

.video-info{
  padding:18px;
}

.video-info h3{
  margin-bottom:10px;
}

.video-info p{
  color:#bcbcbc;
  line-height:1.5;
}

footer{
  border-top:1px solid var(--line);
  text-align:center;
  padding:30px;
  color:#8f8f8f;
}

@media(max-width:768px){
  header{
    padding:15px 20px;
  }

  .logo{
    height:35px;
  }

  .video-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html">
    <img src="assets/ywm-logo-transparent.png" class="logo" alt="YWM">
  </a>

  <a href="work.html" class="back-btn">
    ← Back to Work
  </a>
</header>

<section class="hero">
  <h1>Crafted Outdoor Elegance</h1>
  <p>
    Bringing outdoor spaces to life through cinematic storytelling.
  </p>
</section>

<div class="container">

  <div class="video-grid">

    <div class="video-card">
      <video controls playsinline>
        <source src="assets/pergola-builder/fr_gazebo_1.mp4" type="video/mp4">
      </video>
      <div class="video-info">
        <h3>Kutil Mike</h3>
        <p>Řevničov Project</p>
      </div>
    </div>

    <div class="video-card">
      <video controls playsinline>
        <source src="assets/pergola-builder/16x9_Kutil Mike -Pergola Smecno26.04_D4.mp4" type="video/mp4">
      </video>
      <div class="video-info">
        <h3>Kutil Mike</h3>
        <p>Smečno Project</p>
      </div>
    </div>
     <div class="video-card">
      <video controls playsinline>
        <source src="assets/pergola-builder/Kutil Mike -Pergola Smecno - Pop2.mp4" type="video/mp4">
      </video>
      <div class="video-info">
        <h3>Kutil Mike</h3>
        <p>Smečno Project</p>
      </div>
    </div>
     <div class="video-card">
      <video controls playsinline>
        <source src="assets/pergola-builder/MLUVICI_Kutil Mike -Pergola Smecno26.04_D2.mp4" type="video/mp4">
      </video>
      <div class="video-info">
        <h3>Kutil Mike</h3>
        <p>Smečno Project</p>
      </div>
    </div>

  </div>

</div>

<footer>
  © 2026 YWM — Yellow World Media
</footer>

</body>
</html>
