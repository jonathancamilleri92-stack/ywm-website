<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fine Art Photography | YWM</title>

<style>
body{
  margin:0;
  background:#030303;
  color:white;
  font-family:Arial,sans-serif;
}

.header{
  padding:30px;
  text-align:center;
}

.header h1{
  margin:0;
  color:#f4c400;
}

.back{
  display:inline-block;
  margin-top:15px;
  color:#f4c400;
  text-decoration:none;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  padding:30px;
}

.gallery img{
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  border-radius:20px;
  display:block;
}

.gallery img:hover{
  transform:scale(1.02);
  transition:.25s ease;
}

@media(max-width:768px){
  .gallery{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>Fine Art</h1>
  <a class="back" href="index.html#photography">← Back to Photography</a>
</div>

</body>
</html>
